name: 🐛 Something's broken
description: Tell us what went wrong while playing.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. iPhone 15, Safari
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: Drag an image or video in here.
